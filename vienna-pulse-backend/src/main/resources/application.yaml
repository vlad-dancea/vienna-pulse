spring:
  application:
    name: vienna-pulse-backend
  # Connection settings come from the environment in production
  # (deploy/compose.yaml) and from Testcontainers in tests and local runs.
  datasource:
    hikari:
      maximum-pool-size: 5
  flyway:
    # Fail on misnamed migration files instead of silently skipping them.
    validate-migration-naming: true

management:
  endpoints:
    web:
      exposure:
        include: health

pulse:
  cors:
    # Browser origins allowed to call /api/**: production SPA and the Angular dev server.
    allowed-origins: https://pulse.vladdancea.com,http://localhost:4200
  gtfs:
    updater:
      # Off until the importer exists (V2). Without it there is nothing to import into.
      enabled: false
