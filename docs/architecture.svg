<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 522" width="640" height="522" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="title">Vienna Pulse architecture</title>
  <desc id="desc">The browser loads the Angular app from Cloudflare Workers, calls the Spring Boot backend through a Cloudflare Tunnel and loads map tiles from OpenFreeMap. The backend stores the timetable in PostgreSQL and checks the Wiener Linien GTFS feed once a day.</desc>
  <style>
    .panel { fill: #ffffff; stroke: #d1d9e0; }
    .box { fill: #f6f8fa; stroke: #d1d9e0; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .detail { fill: #59636e; font-size: 13px; }
    .label { fill: #59636e; font-size: 12px; }
    .edge { fill: none; stroke: #818b98; stroke-width: 1.5; }
    .head { fill: #818b98; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0d1117; stroke: #3d444d; }
      .box { fill: #151b23; stroke: #3d444d; }
      .name { fill: #f0f6fc; }
      .detail, .label { fill: #9198a1; }
      .edge { stroke: #656c76; }
      .head { fill: #656c76; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <rect class="panel" x="0.5" y="0.5" width="639" height="521" rx="12"/>

  <!-- Browser to its three origins -->
  <path class="edge" marker-end="url(#arrow)" d="M320 88 V108 Q320 116 312 116 H128 Q120 116 120 124 V179"/>
  <path class="edge" marker-end="url(#arrow)" d="M320 88 V179"/>
  <path class="edge" marker-end="url(#arrow)" d="M320 88 V108 Q320 116 328 116 H512 Q520 116 520 124 V179"/>
  <text class="label" x="130" y="152">pulse.vladdancea.com</text>
  <text class="label" x="330" y="152">api.pulse.vladdancea.com</text>
  <text class="label" x="530" y="152">map tiles</text>

  <!-- Tunnel to backend -->
  <path class="edge" marker-end="url(#arrow)" d="M320 240 V291"/>

  <!-- Backend to database and feed -->
  <path class="edge" marker-end="url(#arrow)" d="M320 352 V372 Q320 380 312 380 H228 Q220 380 220 388 V433"/>
  <path class="edge" marker-end="url(#arrow)" d="M320 352 V372 Q320 380 328 380 H412 Q420 380 420 388 V433"/>
  <text class="label" x="430" y="414">daily check</text>

  <g text-anchor="middle">
    <rect class="box" x="230" y="28" width="180" height="60" rx="8"/>
    <text class="name" x="320" y="54">Browser</text>
    <text class="detail" x="320" y="74">Angular, MapLibre GL</text>

    <rect class="box" x="30" y="180" width="180" height="60" rx="8"/>
    <text class="name" x="120" y="206">Cloudflare Workers</text>
    <text class="detail" x="120" y="226">static assets</text>

    <rect class="box" x="230" y="180" width="180" height="60" rx="8"/>
    <text class="name" x="320" y="215">Cloudflare Tunnel</text>

    <rect class="box" x="430" y="180" width="180" height="60" rx="8"/>
    <text class="name" x="520" y="206">OpenFreeMap</text>
    <text class="detail" x="520" y="226">basemap</text>

    <rect class="box" x="230" y="292" width="180" height="60" rx="8"/>
    <text class="name" x="320" y="318">Spring Boot backend</text>
    <text class="detail" x="320" y="338">Java 25</text>

    <rect class="box" x="130" y="434" width="180" height="60" rx="8"/>
    <text class="name" x="220" y="460">PostgreSQL 18</text>
    <text class="detail" x="220" y="480">TimescaleDB</text>

    <rect class="box" x="330" y="434" width="180" height="60" rx="8"/>
    <text class="name" x="420" y="460">Wiener Linien</text>
    <text class="detail" x="420" y="480">GTFS feed</text>
  </g>
</svg>
