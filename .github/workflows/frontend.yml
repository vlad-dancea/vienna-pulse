name: Frontend

on:
  push:
    branches: [main]
    paths:
      - vienna-pulse-frontend/**
      - mise.toml
      - mise.lock
      - .github/workflows/frontend.yml
  pull_request:
    paths:
      - vienna-pulse-frontend/**
      - mise.toml
      - mise.lock
      - .github/workflows/frontend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: vienna-pulse-frontend

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('vienna-pulse-frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm ng test --watch=false

      - name: Build
        run: pnpm ng build

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: vienna-pulse-frontend/dist/vienna-pulse-frontend/browser
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://pulse.vladdancea.com
    concurrency:
      group: frontend-deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: vienna-pulse-frontend/dist/vienna-pulse-frontend/browser

      - name: Deploy with Wrangler
        run: wrangler deploy --message "${GITHUB_SHA::7} ${GITHUB_EVENT_NAME}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          for path in / /line/U4; do
            curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://pulse.vladdancea.com${path}" | grep -q '<app-root' \
              || { echo "::error::${path} did not serve the app"; exit 1; }
          done
